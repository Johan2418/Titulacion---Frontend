# Plantilla de nginx: la imagen sustituye ${BACKEND_URL} al iniciar (/etc/nginx/templates) y el
# resultado se incluye en el contexto `http`, por eso aquí pueden declararse las zonas de límites.
# Archivos compartidos (se copian a /etc/nginx/snippets, ver Dockerfile):
#   security-headers.conf  cabeceras de seguridad (único lugar donde se definen)
#   proxy-api.conf         ajustes del proxy hacia el backend
# IP real tras un balanceador de confianza: variable TRUSTED_PROXY_CIDR (ver 25-real-ip.sh).

# Límites por IP de origen. Los valores por defecto son holgados porque muchos usuarios (p. ej. un
# campus) pueden compartir una misma IP por NAT; se ajustan con variables de entorno (Dockerfile):
#   RATE_LIMIT_AUTH / RATE_LIMIT_AUTH_BURST   /api/v1/auth/   (def. 20r/s, ráfaga 40)
#   RATE_LIMIT_API  / RATE_LIMIT_API_BURST    /api/v1/        (def. 100r/s, ráfaga 200)
#   LIMIT_CONN_PER_IP                         conexiones simultáneas por IP al API (def. 100)
#   LIMIT_CONN_UPLOAD_PER_IP                  conexiones simultáneas por IP a rutas de subida (def. 10)
limit_req_zone $binary_remote_addr zone=auth:10m rate=${RATE_LIMIT_AUTH};
limit_req_zone $binary_remote_addr zone=api:10m rate=${RATE_LIMIT_API};
limit_conn_zone $binary_remote_addr zone=perip:10m;
# Zona propia para las subidas: si compartiera `perip`, el contador incluiría todas las
# conexiones al API y el límite de subidas se agotaría con tráfico que no es de subida.
limit_conn_zone $binary_remote_addr zone=perip_upload:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  limit_req_status 429;
  limit_conn_status 429;

  # OJO: nginx solo hereda add_header del nivel superior si el location NO declara ninguno
  # propio; por eso todo location con add_header vuelve a incluir este archivo.
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Recursos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA: todas las rutas sirven index.html (sin caché)
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # La documentación interactiva del backend (/docs, /docs-json) no se expone públicamente.
  location ^~ /api/v1/docs {
    return 404;
  }

  # Autenticación: límite más estricto. proxy_pass conserva el segmento /auth/ al quitar el prefijo.
  location /api/v1/auth/ {
    limit_req zone=auth burst=${RATE_LIMIT_AUTH_BURST} nodelay;
    limit_conn perip ${LIMIT_CONN_PER_IP};
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass ${BACKEND_URL}/auth/;
  }

  # Subidas multipart (plantillas y entregas PAT, importaciones XLSX). Es un location con regex
  # porque las rutas llevan UUID; las regex se evalúan después del prefijo más largo y ganan a
  # `/api/v1/` (sin `^~`). No puede capturar /api/v1/docs ni /api/v1/auth/ porque solo coincide
  # con las rutas de subida listadas. Con regex, proxy_pass no admite URI: el prefijo se quita con
  # `rewrite ... break` y se envía el URI reescrito (la query se conserva).
  # El límite es por IP y varios estudiantes de un campus pueden compartir una (NAT); por eso el
  # valor por defecto es 10 y no 1. El límite por usuario lo aplica el backend.
  location ~ "^/api/v1/(periodos/[^/]+/(asignaciones-tema/[^/]+/documentos-pat|plantillas-pat|importaciones/estudiantes/validar)|importaciones/(docentes|temas)/validar)/?$" {
    limit_req zone=api burst=${RATE_LIMIT_API_BURST} nodelay;
    limit_conn perip_upload ${LIMIT_CONN_UPLOAD_PER_IP};
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass ${BACKEND_URL};
  }

  # API: mismo origen que la SPA. Se quita el prefijo /api/v1 (el backend publica sus rutas en la
  # raíz).
  location /api/v1/ {
    limit_req zone=api burst=${RATE_LIMIT_API_BURST} nodelay;
    limit_conn perip ${LIMIT_CONN_PER_IP};
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass ${BACKEND_URL}/;
  }
}
