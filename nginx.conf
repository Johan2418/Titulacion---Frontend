server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad (el TLS lo termina el balanceador / ingress, RNF-02).
  # OJO: nginx solo hereda add_header del nivel superior si el location NO declara ningún
  # add_header propio. Por eso los location /assets/ y / repiten este bloque completo; si se
  # agrega o cambia una cabecera aquí, hay que replicarla allí. Las ubicaciones sin add_header
  # propio (/healthz, /api/v1/) heredan este bloque.
  # CSP: estilos 'unsafe-inline' por los estilos en línea de Radix/Sonner; no hay CDN ni
  # fuentes externas (todo se sirve desde el mismo origen). blob: cubre las descargas generadas.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Recursos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
  }

  # SPA: todas las rutas sirven index.html (sin caché)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }

  # API: mismo origen que la SPA. Se quita el prefijo /api/v1 (el backend publica sus rutas en la
  # raíz) y la cookie de renovación (Path=/auth) se reescribe para que el navegador la envíe aquí.
  location /api/v1/ {
    proxy_pass ${BACKEND_URL}/;
    proxy_cookie_path /auth /api/v1/auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }
}
