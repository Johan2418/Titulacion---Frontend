# Ajustes comunes del proxy hacia el backend (incluido por /api/v1/, /api/v1/auth/ y el location de subidas).
# La cookie de renovación (Path=/auth) se reescribe para que el navegador la envíe a /api/v1/auth.
# X-Forwarded-For se fija a $remote_addr (no se acumula lo que envíe el cliente): con
# TRUSTED_PROXY_CIDR, $remote_addr ya es la IP real resuelta desde el balanceador de confianza.
proxy_cookie_path /auth /api/v1/auth;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
client_max_body_size 12m;
# nginx es la única fuente de las cabeceras de seguridad (security-headers.conf y Cache-Control en
# cada location del API): se ocultan las del backend para que lleguen una sola vez al cliente.
# Declararlo aquí, y no por location, evita que un location nuevo olvide ocultarlas.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Cache-Control;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
