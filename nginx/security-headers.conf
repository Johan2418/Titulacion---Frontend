# Cabeceras de seguridad (el TLS lo termina el balanceador / ingress, RNF-02).
# Única fuente: se incluye en el server y en CADA location que declara su propio add_header,
# porque nginx descarta los add_header heredados en cuanto un location define alguno.
# CSP: estilos 'unsafe-inline' por los estilos en línea de Radix/Sonner; no hay CDN ni
# fuentes externas (todo se sirve desde el mismo origen). blob: cubre las descargas generadas.
# No se agrega `upgrade-insecure-requests`: el uso local documentado es http://localhost:8080 y
# la directiva forzaría https en los subrecursos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
